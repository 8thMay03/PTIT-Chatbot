# Alembic configuration for PTIT Chatbot

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
version_locations = alembic/versions
path_separator = os
output_encoding = utf-8
sqlalchemy.url = postgresql+psycopg://ptit_user:ptit_password@localhost:5432/ptit_chatbot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
