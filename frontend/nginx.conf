# Nginx của image production (stage cuối frontend/Dockerfile): phục vụ dist/ của
# Vite và chuyển /api/ tới backend:8000. Snippet trong frontend/nginx/ được chép
# vào /etc/nginx/snippets/.
#
# - Trần body: mặc định 1m; /api/ 10m (PUT …/markdown của tài liệu lớn); upload
#   POST /api/documents 55m (backend vẫn từ chối > 50MB với thông điệp riêng);
#   chat 64k.
# - Timeout đọc upstream: /api/ 120s; /api/chat/stream 300s, không buffer, không
#   gzip (NDJSON tới từng dòng ngay); route chia đoạn đồng bộ 600s.
# - Header: xem nginx/security-headers.conf và nginx/page-headers.conf. Location nào
#   có add_header riêng phải include một trong hai file (nginx không kế thừa
#   add_header cấp server vào location đó).
# - Cache: /assets/* (tên có hash) cache 1 năm, immutable; index.html và file tĩnh
#   khác no-cache.
# - Không có HSTS: container chỉ nghe HTTP; thêm ở nơi kết thúc TLS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # text/html luôn được nén khi gzip on. Không có application/x-ndjson (stream).
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/markdown;

    # Response không đi qua location nào bên dưới (vd. 400 do request hỏng).
    include /etc/nginx/snippets/page-headers.conf;

    # ---- API ----

    location = /api/chat/stream {
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 64k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location = /api/chat {
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 64k;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Upload tài liệu (GET danh sách cũng khớp location này).
    location = /api/documents {
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 55m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Chia đoạn chạy đồng bộ trong request: 600s là TẠM THỜI, hạ về 120s khi BE-15
    # chuyển chia đoạn sang job nền.
    location ~ ^/api/(ingest(/chunk)?|documents/[^/]+/chunk|datasets/[^/]+/chunk)$ {
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 10m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Mọi route /api/ khác. Buffering bật (mặc định); chỉ stream cần tắt — route mới
    # phát dần (StreamingResponse) phải có location riêng như /api/chat/stream.
    location /api/ {
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- SPA ----

    # File build có hash trong tên. Không rơi về index.html: asset cũ đã bị xoá sau
    # khi deploy phải là 404, không phải HTML (lỗi MIME khó hiểu).
    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/page-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cả SPA fallback bên dưới cũng redirect nội bộ tới đây.
    location = /index.html {
        include /etc/nginx/snippets/page-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/page-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
