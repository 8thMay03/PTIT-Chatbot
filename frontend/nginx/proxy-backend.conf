# Chuyển tiếp tới backend. Timeout và trần body đặt ở từng location.
# Giữ X-Forwarded-For dạng nối thêm: backend (auth.client_ip) duyệt từ phải sang
# trái và chỉ tin TRUSTED_PROXY_IPS, nên client không giả được IP.
proxy_pass http://backend:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
