# Header bảo mật chung cho mọi response (kể cả lỗi nhờ `always`).
#
# nginx: một location có `add_header` riêng thì KHÔNG kế thừa `add_header` cấp
# server, nên mọi location có `add_header` phải include file này (trực tiếp hoặc
# qua page-headers.conf). Test frontend/scripts/nginx-csp.test.mjs kiểm điều đó.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# SAMEORIGIN (không DENY): trang tự nhúng PDF của /api/documents/{id}/file trong iframe.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
