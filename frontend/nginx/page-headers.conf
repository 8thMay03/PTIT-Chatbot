# Header cho trang SPA và file tĩnh: header chung + Content-Security-Policy.
# Response /api/ KHÔNG dùng file này (chỉ security-headers.conf) để CSP của trang
# không ảnh hưởng trình xem PDF với tệp gửi `inline`.
#
# CSP (giá trị phải nằm trên một dòng):
#   default-src 'self'
#   script-src 'self' 'sha256-…'   hash = sha256 base64 của ĐÚNG nội dung theme script
#                                   inline trong frontend/index.html (tính cả xuống dòng,
#                                   thụt lề, file LF). Sửa script thì cập nhật hash;
#                                   frontend/scripts/nginx-csp.test.mjs sẽ báo nếu lệch.
#   style-src 'self' 'unsafe-inline'  docx-preview chèn <style>/style attr khi render DOCX
#   img-src 'self' data: blob:        docx-preview tạo blob: cho ảnh trong DOCX
#   font-src 'self' data: blob:       @fontsource tự host; phông nhúng trong DOCX
#   connect-src 'self'                API cùng origin (VITE_API_BASE_URL=/api). Build với
#                                     API khác origin thì phải thêm origin đó vào đây.
#   frame-src 'self'                  iframe PDF /api/documents/{id}/file?inline=true
#   worker-src 'self' blob:
#   object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'
include /etc/nginx/snippets/security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-/i5zcdNRCH+JXl4LeiOm0IMN5LmcAnrWp5iUl0Ep038='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
