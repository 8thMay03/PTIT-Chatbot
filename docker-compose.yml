services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ptit_chatbot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptit_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-ptit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptit_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptit_user} -d ${POSTGRES_DB:-ptit_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ptit_user}:${POSTGRES_PASSWORD:-ptit_password}@postgres:5432/${POSTGRES_DB:-ptit_chatbot}
      DOCUMENTS_PATH: /app/data
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PTIT_AUTO_INGEST: ${PTIT_AUTO_INGEST:-true}
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      - ./backend/alembic.ini:/app/backend/alembic.ini
      - ./backend/scripts:/app/backend/scripts
      - backend_storage:/app/backend/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
      args:
        VITE_API_BASE_URL: /api
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
  frontend_node_modules:


